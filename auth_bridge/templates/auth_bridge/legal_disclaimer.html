{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign Legal Notice</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to   { opacity: 1; transform: scale(1); }
        }
        .animate-fade-in {
            animation: fadeIn 0.2s ease-out;
        }
    </style>
</head>
<body class="gradient-bg min-h-screen flex items-center justify-center p-4">
    <!-- Legal Disclaimer Modal -->
    {% include 'auth_bridge/_legal_disclaimer_modal.html' %}

    <script src="{% static 'auth_bridge/js/legal_disclaimer.js' %}"></script>
    <script>
        window.currentNextUrl = '{{ next_url|escapejs }}';
        window.WUN_URL = '{{ wun_url|escapejs }}';
        document.addEventListener('DOMContentLoaded', function() {
            window.triggerLegalDisclaimerGate(window.currentNextUrl);
        });
    </script>
</body>
</html>
