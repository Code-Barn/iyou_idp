<!-- Divider -->
<div class="relative mb-6">
    <div class="absolute inset-0 flex items-center">
        <div class="w-full border-t border-gray-200"></div>
    </div>
    <div class="relative flex justify-center">
        <span class="bg-white px-3 text-gray-400 text-sm">or</span>
    </div>
</div>

<!-- Email / Password form -->
<form method="POST" action="{% url 'auth_bridge:managed_login' %}">
    {% csrf_token %}
    <div class="mb-4">
        <label for="managed-email" class="block text-gray-700 text-sm font-medium mb-1">Email</label>
        <input type="email" name="email" id="managed-email" required
               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-sm"
               placeholder="you@example.com">
    </div>
    <div class="mb-6">
        <label for="managed-password" class="block text-gray-700 text-sm font-medium mb-1">Password</label>
        <input type="password" name="password" id="managed-password" required
               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-sm"
               placeholder="••••••••">
    </div>
    <button type="submit"
            class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-medium transition-colors text-sm">
        Sign In
    </button>
    <p class="text-xs text-gray-400 text-center mt-2">New to iyou? We'll create your account automatically.</p>
</form>

<!-- Passkey -->
<div class="mt-4 text-center">
    <button id="passkey-auth-btn"
            class="text-indigo-600 hover:text-indigo-800 text-sm font-medium transition-colors">
        🔑 Sign in with Passkey
    </button>
</div>
