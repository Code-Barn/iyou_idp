<!-- Divider -->
<div class="relative mb-6">
    <div class="absolute inset-0 flex items-center">
        <div class="w-full border-t border-gray-200"></div>
    </div>
    <div class="relative flex justify-center">
        <span class="bg-white px-3 text-gray-400 text-sm">or</span>
    </div>
</div>

<!-- Passwordless Email OTP Verification Engine (2-Step UI) -->
<div id="email-otp-container" class="space-y-4">
    <!-- Step A: Email Input -->
    <div id="otp-step-a" class="space-y-4">
        <div>
            <label for="otp-email" class="block text-gray-700 text-sm font-medium mb-1">Email address</label>
            <input type="email" id="otp-email" required
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-sm"
                   placeholder="you@example.com">
        </div>
        <div id="otp-step-a-error" class="hidden p-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-xs"></div>
        <button type="button" id="send-otp-btn"
                class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-medium transition-colors text-sm flex items-center justify-center gap-2">
            <span>Send Verification Code</span>
        </button>
        <p class="text-xs text-gray-400 text-center">We will send a 6-digit verification code to your email.</p>
    </div>

    <!-- Step B: 6-digit OTP Code Input -->
    <div id="otp-step-b" class="hidden space-y-4">
        <div class="p-3 bg-indigo-50 border border-indigo-100 rounded-lg flex items-center justify-between">
            <div class="text-xs text-indigo-900">
                Code sent to <span id="otp-target-email" class="font-semibold"></span>
            </div>
            <button type="button" id="change-email-btn" class="text-xs text-indigo-600 hover:text-indigo-800 font-medium underline">
                Change
            </button>
        </div>
        <div>
            <label for="otp-code" class="block text-gray-700 text-sm font-medium mb-1">6-digit Verification Code</label>
            <input type="text" id="otp-code" maxlength="6" inputmode="numeric" pattern="[0-9]{6}" autocomplete="one-time-code" required
                   class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-base tracking-[0.35em] text-center font-mono font-semibold"
                   placeholder="••••••">
        </div>
        <div id="otp-step-b-error" class="hidden p-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-xs"></div>
        <button type="button" id="verify-otp-btn"
                class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-medium transition-colors text-sm flex items-center justify-center gap-2">
            <span>Verify & Ingress</span>
        </button>
        <div class="flex items-center justify-between text-xs text-gray-500 pt-1">
            <span>Didn't receive code?</span>
            <button type="button" id="resend-otp-btn" class="text-indigo-600 hover:text-indigo-800 font-medium">
                Resend Code
            </button>
        </div>
    </div>
</div>

<!-- Passkey -->
<div class="mt-4 text-center">
    <button id="passkey-auth-btn"
            class="text-indigo-600 hover:text-indigo-800 text-sm font-medium transition-colors">
        🔑 Sign in with Passkey
    </button>
    <div id="passkey-notice"
         class="hidden mt-2 text-xs font-medium text-amber-600 transition-opacity"
         role="status" aria-live="polite"></div>
</div>
