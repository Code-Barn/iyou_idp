{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DID Admin Dashboard</title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="max-w-4xl mx-auto py-8 px-4">
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <h1 class="text-2xl font-bold text-gray-800">DID Admin Dashboard</h1>
            <p class="text-gray-600 mt-2">Authenticated with your DID</p>
        </div>

        <div class="bg-white rounded-lg shadow-md p-6">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">Identity Info</h2>
            <div class="space-y-3">
                <div>
                    <span class="text-sm text-gray-500">DID</span>
                    <p class="font-mono text-sm bg-gray-50 p-2 rounded">{{ did }}</p>
                </div>
                <div>
                    <span class="text-sm text-gray-500">Superuser</span>
                    <p class="text-gray-800">{{ is_superuser|yesno:"Yes,No" }}</p>
                </div>
            </div>
            <div class="mt-6 flex gap-3">
                <a href="/admin/" class="inline-block bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Django Admin</a>
                <form method="POST" action="{% url 'admin:logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="bg-gray-200 text-gray-700 px-4 py-2 rounded hover:bg-gray-300">Logout</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
